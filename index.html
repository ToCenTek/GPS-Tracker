<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GPS追踪系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#1a73e8;--bg:#f5f7fa;--c:#fff;--t:#1a1a2e;--ts:#6b7280;--b:#e5e7eb;--s:#10b981;--w:#f59e0b;--d:#ef4444}
</style>
<link rel="stylesheet" href="/leaflet.css?v=2" />
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);overflow:hidden;height:100vh;width:100vw}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.95)}.btn-primary{background:var(--p);color:#fff}.btn-success{background:var(--s);color:#fff}.btn-danger{background:var(--d);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--b);color:var(--t)}.btn-sm{padding:6px 14px;font-size:12px}
#sb{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--c);padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--b);height:48px;font-size:13px}
.si{display:flex;align-items:center;gap:4px;color:var(--ts)}.si .dot{width:8px;height:8px;border-radius:50%}.dg{background:var(--s)}.dr{background:var(--d)}.si .v{color:var(--t);font-weight:600}
#map{position:fixed;top:90px;left:0;right:0;bottom:0;z-index:1;height:calc(100vh - 90px)}
.leaflet-control-zoom a{background:var(--c)!important;color:var(--t)!important;border-color:var(--b)!important}
#tb{position:fixed;top:48px;left:0;right:0;z-index:999;display:flex;align-items:center;gap:4px;padding:6px 12px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--b);height:42px;font-size:13px}
.tb-btn{width:34px;height:34px;padding:0;border:none;border-radius:8px;background:transparent;color:var(--ts);font-size:17px;cursor:pointer}
.tb-btn:active{background:var(--bg);color:var(--p)}.tb-btn.act{background:var(--p);color:#fff}.tb-sep{width:1px;height:20px;background:var(--b);margin:0 4px}
.tb-lbl{font-size:11px;font-weight:600;color:var(--p);padding:2px 8px;background:#e8f0fe;border-radius:4px;margin-left:auto}
#bp{position:fixed;left:0;right:0;bottom:0;z-index:999;background:var(--c);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.1);transition:transform .3s;max-height:48vh;display:flex;flex-direction:column}
#bp.min{transform:translateY(calc(100% - 52px))}
#bh{display:flex;align-items:center;justify-content:center;padding:8px;cursor:pointer;flex-shrink:0}
#bh .bar{width:32px;height:4px;background:#d1d5db;border-radius:2px}
#bt{display:flex;border-bottom:1px solid var(--b);flex-shrink:0}
.tab{flex:1;padding:10px 4px;border:none;background:none;font-size:13px;font-weight:500;color:var(--ts);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{font-size:18px}.tab.act{color:var(--p)}.tab.act::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:3px;background:var(--p);border-radius:3px}
#pc{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.tc{display:none}.tc.act{display:block}.tc h3{margin:0 0 12px;font-size:16px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ii{padding:10px 12px;background:var(--bg);border-radius:8px}
.ii .l{font-size:11px;color:var(--ts);text-transform:uppercase}.ii .v{font-size:16px;font-weight:700;margin-top:2px}.ii .v .u{font-size:12px;font-weight:400;color:var(--ts)}
.fg{margin-bottom:12px}.fg label{display:block;font-size:13px;color:var(--ts);margin-bottom:4px;font-weight:500}.fg input,.fg select{width:100%;padding:10px 14px;border:1.5px solid var(--b);border-radius:8px;font-size:14px;outline:none;background:var(--c)}
.fg input:focus{border-color:var(--p)}.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.bg .btn{flex:1;min-width:80px}
.st{font-size:14px;font-weight:600;color:var(--ts);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--b)}
.ci{padding:12px;background:var(--bg);border-radius:10px;margin-bottom:8px}.ci .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.ci .cl{font-size:13px;font-weight:600}.ci .cd{font-size:11px;color:var(--ts)}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:500;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.show{opacity:1}#toast.success{background:var(--s)}#toast.warning{background:var(--w)}#toast.danger{background:var(--d)}
@media(max-width:480px){.ig{grid-template-columns:1fr 1fr;gap:6px}.ii{padding:8px 10px}#bp{max-height:52vh}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="sb">
  <div class="si"><span class="dot dr" id="gps-dot"></span><span id="gps-st">等待</span></div>
  <div class="si">🛰 <span class="v" id="sat-n">0</span></div>
  <div class="si">📦 <span class="v" id="gid-n">0</span></div>
  <span style="margin-left:auto;font-size:12px;padding:2px 8px;border-radius:12px;background:#e8f0fe;color:var(--p);font-weight:600" id="wfb">AP</span>
  <div class="si">📍 <span class="v" id="gps-ll">--</span></div>
</div>
<canvas id="cv"></canvas>
<div id="map"></div>
<div id="tb">
  <button class="tb-btn" id="btn-center" title="回位置">📍</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-trk" title="轨迹">✏️</button>
  <button class="tb-btn" id="btn-clr" title="清除">🗺️</button>
  <span class="tb-lbl" id="tb-gid">📦 0</span>
</div>
<div id="bp" class="min">
  <div id="bh"><div class="bar"></div></div>
  <div id="bt">
    <button class="tab act" data-t="pos">📍位置</button>
    <button class="tab" data-t="trk">🗺️轨迹</button>
    <button class="tab" data-t="grd">🔲网格</button>
    <button class="tab" data-t="wif">📶WiFi</button>
    <button class="tab" data-t="cfg">⚙️设置</button>
  </div>
  <div id="pc">
    <div class="tc act" id="tp-pos"><h3>实时位置</h3><div class="ig">
      <div class="ii"><div class="l">纬度</div><div class="v" id="p-la">--</div></div>
      <div class="ii"><div class="l">经度</div><div class="v" id="p-lo">--</div></div>
      <div class="ii"><div class="l">海拔</div><div class="v" id="p-al">-- <span class="u">m</span></div></div>
      <div class="ii"><div class="l">航向</div><div class="v" id="p-cr">-- <span class="u">°</span></div></div>
      <div class="ii"><div class="l">速度(节)</div><div class="v" id="p-sk">--</div></div>
      <div class="ii"><div class="l">km/h</div><div class="v" id="p-skm">--</div></div>
      <div class="ii"><div class="l">卫星</div><div class="v" id="p-sat">0</div></div>
      <div class="ii"><div class="l">模式</div><div class="v" id="p-mod">--</div></div>
      <div class="ii"><div class="l">UTC</div><div class="v" id="p-utc">--</div></div>
      <div class="ii"><div class="l">网格</div><div class="v" id="p-gid">0</div></div>
    </div></div>
    <div class="tc" id="tp-trk"><h3>轨迹</h3><div class="bg">
      <button class="btn btn-success" id="trk-s">▶开始</button>
      <button class="btn btn-danger" id="trk-p">■停止</button>
      <button class="btn btn-outline" id="trk-c">🗑️清除</button>
    </div><p style="font-size:13px;color:var(--ts);margin-top:8px" id="trk-i">轨迹:0</p></div>
    <div class="tc" id="tp-grd"><h3>网格</h3>
      <div class="bg"><button class="btn btn-primary" id="g-reg">📐从轨迹生成</button><button class="btn btn-outline" id="g-clr">🗑️清除</button></div>
      <p style="font-size:12px;color:var(--ts)" id="g-pts">区域点:0</p>
      <div class="st">划分</div>
      <div class="fr"><div class="fg"><label>边长(米)</label><input type="number" id="g-sz" value="2" min="2" max="40075000"></div><div class="fg"><label>总数</label><input type="text" id="g-tot" readonly></div></div>
      <div class="bg"><button class="btn btn-primary" id="g-gen">🔲生成</button><button class="btn btn-outline" id="g-del">🗑️清除</button></div>
    </div>
    <div class="tc" id="tp-wif"><h3>WiFi</h3>
      <p style="font-size:13px;color:var(--ts)">AP:<b>GPS</b>密码<b>12345678</b></p>
      <div class="ci" style="padding:10px">
        <div class="fr"><div class="fg" style="margin-bottom:0"><label>SSID</label><input type="text" id="w-ss"></div><div class="fg" style="margin-bottom:0"><label>密码</label><input type="password" id="w-pw"></div></div>
        <div class="bg"><button class="btn btn-sm btn-primary" id="w-con">连接</button><button class="btn btn-sm btn-outline" id="w-scan">📡扫描</button><button class="btn btn-sm btn-outline" id="w-dis">断开</button></div>
      </div>
      <div id="w-sl"></div>
      <p style="font-size:12px;color:var(--ts);margin-top:8px" id="w-st">状态:--</p>
      <div id="w-gd" style="display:none;margin-top:10px;padding:12px;background:#e8f0fe;border-radius:10px;font-size:13px"><b>📶 STA已连!</b><br>访问: <b id="w-ip">--</b></div>
    </div>
    <div class="tc" id="tp-cfg"><h3>N305-5Q</h3>
      <div class="ci"><div class="ch"><span class="cl">波特率</span><select id="c-bd"><option value="0">4800</option><option value="1">9600</option><option value="2">19200</option><option value="3">38400</option><option value="4">57600</option><option value="5" selected>115200</option><option value="6">230400</option></select></div><div class="cd">需重启</div><button class="btn btn-sm btn-primary" style="margin-top:6px" onclick="nm('baud')">设置</button></div>
      <div class="ci"><div class="ch"><span class="cl">间隔</span><select id="c-in"><option value="100">100ms</option><option value="200">200ms</option><option value="500">500ms</option><option value="1000" selected>1s</option><option value="5000">5s</option><option value="10000">10s</option></select></div><button class="btn btn-sm btn-primary" style="margin-top:6px" onclick="nm('int')">设置</button></div>
      <div class="ci"><div class="ch"><span class="cl">模式</span><select id="c-mo"><option value="1">BDS</option><option value="2">GPS</option><option value="3" selected>BDS+GPS</option><option value="4">GLO</option><option value="5">BDS+GLO</option><option value="6">GPS+GLO</option></select></div><button class="btn btn-sm btn-primary" style="margin-top:6px" onclick="nm('mod')">切换</button></div>
      <div class="ci"><div class="ch"><span class="cl">恢复默认</span></div><div class="cd">需重启</div><button class="btn btn-sm btn-danger" style="margin-top:6px" onclick="nm('dft')">恢复</button></div>
      <div class="ci"><span class="cl">NMEA语句</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"><button class="btn btn-xs btn-outline active" onclick="tN(this,'RMC')">RMC</button><button class="btn btn-xs btn-outline" onclick="tN(this,'GGA')">GGA</button><button class="btn btn-xs btn-outline" onclick="tN(this,'GSA')">GSA</button><button class="btn btn-xs btn-outline" onclick="tN(this,'GSV')">GSV</button><button class="btn btn-xs btn-outline" onclick="tN(this,'VTG')">VTG</button><button class="btn btn-xs btn-outline" onclick="tN(this,'ZDA')">ZDA</button></div></div>
      <div class="ci" style="background:#fff3cd"><div class="ch"><span class="cl">冷启动</span></div><button class="btn btn-sm btn-warning" style="margin-top:6px" onclick="nm('cold')">冷启动</button></div>
      <div class="ci" style="background:#f0f9ff"><span class="cl">原始NMEA</span><input type="text" id="c-raw" placeholder="$CCxxx,...*hh" style="font-family:monospace;font-size:12px;width:100%;padding:10px;border:1.5px solid var(--b);border-radius:8px;margin:8px 0;outline:none"><button class="btn btn-sm btn-primary" onclick="nmR()">发送</button></div>
    </div>
  </div>
</div>
<script src="/leaflet.js?v=2"></script>
<script>
// ===== 先注册Toast和面板(确保按钮可用) =====
function toa(m,t){var e=document.getElementById('toast');if(!e)return;e.textContent=m;e.className=(t||'info')+' show';clearTimeout(e._h);e._h=setTimeout(function(){e.classList.remove('show');},3000);}
var pnl=document.getElementById('bp'),pnlm=true;
if(pnl){document.getElementById('bh').addEventListener('click',function(){pnlm=!pnlm;pnl.classList.toggle('min',pnlm);});}
document.querySelectorAll('#bt .tab').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('#bt .tab').forEach(function(x){x.classList.remove('act');});
  document.querySelectorAll('.tc').forEach(function(x){x.classList.remove('act');});
  b.classList.add('act');document.getElementById('tp-'+b.dataset.t).classList.add('act');
  if(pnlm){pnlm=false;pnl.classList.remove('min');}});});

// ===== Canvas坐标格网 =====
try {
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0;
function sz(){W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight;try{dr();}catch(e){}}
window.addEventListener('resize',sz);sz();

var cL=30.2943,cG=120.1663,MPD=111320,zoom=0;
var gps={la:cL,lg:cG,v:false,course:0},trk=[],reg=[],isT=false,cel=[];
var drag=false,dx=0,dy=0;

// 拖拽/缩放
cv.addEventListener('mousedown',function(e){drag=true;dx=e.clientX;dy=e.clientY;});
cv.addEventListener('mousemove',function(e){if(!drag)return;var x=e.clientX-dx,y=e.clientY-dy;dx=e.clientX;dy=e.clientY;cL-=y/MPD;cG+=x/(MPD*Math.cos(cL*Math.PI/180));dr();});
cv.addEventListener('mouseup',function(){drag=false;});
cv.addEventListener('wheel',function(e){e.preventDefault();zoom=Math.min(Math.max(zoom+(e.deltaY>0?-1:1),-5),8);dr();},{passive:false});
cv.addEventListener('touchstart',function(e){if(e.touches.length===1){drag=true;dx=e.touches[0].clientX;dy=e.touches[0].clientY;}});
cv.addEventListener('touchmove',function(e){if(!drag||e.touches.length!==1)return;e.preventDefault();cL-=(e.touches[0].clientY-dy)/MPD;cG+=(e.touches[0].clientX-dx)/(MPD*Math.cos(cL*Math.PI/180));dx=e.touches[0].clientX;dy=e.touches[0].clientY;dr();},{passive:false});
cv.addEventListener('touchend',function(){drag=false;});

function dr(){
  W=cv.width=cv.clientWidth||window.innerWidth;H=cv.height=cv.clientHeight||(window.innerHeight-90);
  ctx.fillStyle='#e8ecf0';ctx.fillRect(0,0,W,H);
  // 坐标格网(正方形格子, 细线)
  var step=Math.pow(10,Math.round(Math.log10(H/MPD/10)));
  var mc=Math.cos(cL*Math.PI/180), stepLng=step/mc;
  ctx.strokeStyle='rgba(80,130,180,0.3)';ctx.lineWidth=0.3;
  for(var la=Math.floor((cL-H/MPD)/step)*step;la<cL+H/MPD;la+=step){
    var y=H/2-(la-cL)*MPD;if(y<-5||y>H+5)continue;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(var ln=Math.floor((cG-W/(MPD*mc))/stepLng)*stepLng;ln<cG+W/(MPD*mc);ln+=stepLng){
    var x=W/2+(ln-cG)*MPD*mc;if(x<-5||x>W+5)continue;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  // 格子大小标注
  var cellW=step*MPD*mc,cellH=step*MPD;ctx.fillStyle='rgba(60,100,150,0.6)';ctx.font='9px sans-serif';
  ctx.fillText((cellH<1000?cellH.toFixed(0)+'m':(cellH/1000).toFixed(1)+'km')+'×'+(cellW<1000?cellW.toFixed(0)+'m':(cellW/1000).toFixed(1)+'km'),4,H-6);
  // 区域
  if(reg.length>2){ctx.beginPath();var v=px(reg[0]);ctx.moveTo(v.x,v.y);for(var i=1;i<reg.length;i++){v=px(reg[i]);ctx.lineTo(v.x,v.y);}ctx.closePath();ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(245,158,11,.12)';ctx.fill();}
  // 轨迹
  if(trk.length>1){ctx.beginPath();v=px(trk[0]);ctx.moveTo(v.x,v.y);for(var i=1;i<trk.length;i++){v=px(trk[i]);ctx.lineTo(v.x,v.y);}ctx.strokeStyle='#1a73e8';ctx.lineWidth=3;ctx.stroke();}
  // GPS标记(蓝色箭头)
  if(gps.v&&gps.la){v=px([gps.la,gps.lg]);var a=gps.course*Math.PI/180;
    ctx.save();ctx.translate(v.x,v.y);ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-7);ctx.lineTo(-4,0);ctx.lineTo(-8,7);ctx.closePath();
    ctx.fillStyle='#1a73e8';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();}
  else{ctx.fillStyle='#99aabb';ctx.font='14px sans-serif';ctx.fillText('等待GPS...',W/2-36,H/2);}
}
function px(p){return{x:W/2+(p[1]-cG)*MPD*Math.cos(cL*Math.PI/180)*Math.pow(2,zoom),y:H/2-(p[0]-cL)*MPD*Math.pow(2,zoom)};}
} catch(e) {}

// ===== 按钮事件 =====
document.getElementById('btn-center').addEventListener('click',function(){if(gps.v){cL=gps.la;cG=gps.lg;dr();}});
document.getElementById('btn-trk').addEventListener('click',function(){isT=!isT;if(isT)trk=[];this.classList.toggle('act',isT);toa(isT?'开始':'停','info');});
document.getElementById('btn-clr').addEventListener('click',function(){trk=[];reg=[];cel=[];isT=false;
  document.getElementById('trk-i').textContent='轨迹:0';document.getElementById('g-pts').textContent='区域点:0';
  document.getElementById('tb-gid').textContent='📦 0';document.getElementById('btn-trk').classList.remove('act');dr();});

document.getElementById('trk-s').addEventListener('click',function(){isT=true;trk=[];toa('开始','success');});
document.getElementById('trk-p').addEventListener('click',function(){isT=false;toa('已停','info');});
document.getElementById('trk-c').addEventListener('click',function(){isT=false;trk=[];dr();document.getElementById('trk-i').textContent='轨迹:0';toa('清除','info');});

document.getElementById('g-reg').addEventListener('click',function(){
  if(trk.length<3){toa('需≥3轨迹点','warning');return;}
  reg=trk.slice();reg.push(reg[0]);
  document.getElementById('g-pts').textContent='区域点:'+reg.length;dr();
  var sz=parseInt(document.getElementById('g-sz').value)||2;
  var b=[Infinity,-Infinity,Infinity,-Infinity];reg.forEach(function(p){b[0]=Math.min(b[0],p[0]);b[1]=Math.max(b[1],p[0]);b[2]=Math.min(b[2],p[1]);b[3]=Math.max(b[3],p[1]);});
  cols=Math.ceil((b[3]-b[2])*MPD*Math.cos((b[0]+b[1])/2*Math.PI/180)/sz);rows=Math.ceil((b[1]-b[0])*MPD/sz);
  document.getElementById('g-tot').value=(cols>0&&rows>0)?(cols*rows):'--';toa('区域已生成','success');});
document.getElementById('g-clr').addEventListener('click',function(){reg=[];document.getElementById('g-pts').textContent='区域点:0';dr();});

document.getElementById('g-gen').addEventListener('click',function(){
  if(reg.length<3){toa('先区域','warning');return;}
  var sz=parseInt(document.getElementById('g-sz').value);
  if(isNaN(sz)||sz<2||sz>40075000){toa('边长2~40075000','warning');return;}
  fetch('/grid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grid_size:sz,polygon:reg.slice(0,-1).map(function(p){return[p[1],p[0]];})})})
  .then(function(r){return r.json();}).then(function(d){
    if(d.grids){cel=d.grids.slice(0,500);document.getElementById('g-tot').value=d.total_grids||cel.length;toa('已生成','success');dr();}
  }).catch(function(){toa('失败','danger');});});
document.getElementById('g-del').addEventListener('click',function(){cel=[];document.getElementById('tb-gid').textContent='📦 0';toa('清除','info');dr();});

// ===== GPS =====
  function fGPS(){fetch('/gps').then(function(r){return r.json();}).then(function(d){
  gps.v=d.status==='A'&&d.lat!==0;
  if(gps.v){gps.la=d.lat;gps.lg=d.lng;gps.course=d.course;}
  document.getElementById('gps-dot').className='dot '+(gps.v?'dg':'dr');
  document.getElementById('gps-st').textContent=gps.v?'定位':'等待';
  document.getElementById('sat-n').textContent=d.satellites||0;
  document.getElementById('gid-n').textContent=d.grid||'0';
  document.getElementById('gps-ll').textContent=gps.v?(gps.la.toFixed(4)+','+gps.lg.toFixed(4)):'--';
  document.getElementById('p-la').textContent=gps.v?gps.la.toFixed(6):'--';
  document.getElementById('p-lo').textContent=gps.v?gps.lg.toFixed(6):'--';
  document.getElementById('p-al').innerHTML=gps.v?((d.altitude||0).toFixed(1)+' <span class="u">m</span>'):'--';
  document.getElementById('p-cr').innerHTML=gps.v?((gps.course||0).toFixed(1)+' <span class="u">°</span>'):'--';
  document.getElementById('p-sk').textContent=gps.v?(d.speed_knots||0).toFixed(2):'--';
  document.getElementById('p-skm').textContent=gps.v?(d.speed_kmh||0).toFixed(2):'--';
  document.getElementById('p-sat').textContent=d.satellites||0;
  document.getElementById('p-mod').textContent=gps.v?d.mode:'--';
  document.getElementById('p-utc').textContent=d.bj_time||'--';
  document.getElementById('p-gid').textContent=d.grid||'0';
  document.getElementById('tb-gid').textContent='📦 '+(d.grid||'0');
  if(gps.v&&isT){trk.push([gps.la,gps.lg]);document.getElementById('trk-i').textContent='轨迹:'+trk.length;}
  if(leafGps&&gps.v){leafGps.setLatLng([gps.la,gps.lg]);if(isT)leafTrack.addLatLng([gps.la,gps.lg]);}
  dr();}).catch(function(){});}
setInterval(fGPS,1000);fGPS();

// ===== 在线检测 =====
var online=false;
(function initMap(){
  var test=new Image();
  test.onload=function(){online=true;initLeaflet();};
  test.onerror=initFallback;
  test.src='https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=37067&y=20070&z=16';
  setTimeout(function(){if(!online)initFallback();},4000);
})();

function initLeaflet(){
  try{
    if(typeof L==='undefined')throw'No Leaflet';
    var lmap=L.map('map',{center:[30.2943,120.1663],zoom:16});
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:['1','2','3','4'],maxZoom:18}).addTo(lmap);
    lmap.invalidateSize();
    document.getElementById('cv').style.display='none';
    fetch('http://ip-api.com/json/?fields=status,lat,lon,country').then(function(r){return r.json();}).then(function(d){
      if(d.status==='success'&&d.country==='China')lmap.setView([d.lat,d.lon],16);
    }).catch(function(){});
  }catch(e){console.log('地图:',e);}
}

function initFallback(){
  document.getElementById('map').style.display='none';
  document.getElementById('cv').style.display='block';
}

// ===== WiFi =====
function fWS(){fetch('/wifi/status').then(function(r){return r.json();}).then(function(d){
  document.getElementById('w-st').textContent='IP:'+d.ip+(d.connected?' 已连:'+d.ssid:' 未连');
  document.getElementById('wfb').textContent=d.connected?'STA':'AP';
  var g=document.getElementById('w-gd');
  if(d.connected){document.getElementById('w-ip').textContent='http://'+d.ip;g.style.display='block';}else{g.style.display='none';}}).catch(function(){});}
document.getElementById('w-con').addEventListener('click',function(){
  var s=document.getElementById('w-ss').value.trim(),p=document.getElementById('w-pw').value.trim();
  if(!s){toa('输入名称','warning');return;}
  fetch('/wifi/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:s,password:p})}).then(function(r){return r.json();}).then(function(d){if(d.ok)toa('已连','success');else toa('失败','danger');fWS();}).catch(function(){});});
document.getElementById('w-scan').addEventListener('click',function(){
  document.getElementById('w-sl').innerHTML='<p style="padding:12px;color:var(--ts)">扫描中...</p>';
  fetch('/wifi/scan').then(function(r){return r.json();}).then(function(d){
    var el=document.getElementById('w-sl');el.innerHTML='';
    if(!d.ap_list||!d.ap_list.length){el.innerHTML='<p style="padding:12px;color:var(--ts)">无</p>';return;}
    d.ap_list.forEach(function(a){var x=document.createElement('div');x.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);border-radius:10px;margin-bottom:6px';
      x.innerHTML='<div><div style="font-weight:600;font-size:14px">'+a.ssid+'</div><div style="font-size:11px;color:var(--ts)">信号:'+a.rssi+'dBm '+a.auth+'</div></div><button class="btn btn-xs btn-primary" onclick="document.getElementById(\'w-ss\').value=\''+a.ssid+'\';toa(\'已选\',\'info\')">选</button>';el.appendChild(x);});
  }).catch(function(){document.getElementById('w-sl').innerHTML='<p style="padding:12px;color:var(--d)">失败</p>';});});
document.getElementById('w-dis').addEventListener('click',function(){fetch('/wifi/disconnect',{method:'POST'}).then(function(){toa('已断','info');fWS();}).catch(function(){});});
document.querySelector('[data-t="wif"]').addEventListener('click',fWS);
setInterval(fWS,5000);fWS();

// ===== NMEA =====
function nCS(s){var c=0;for(var i=0;i<s.length;i++)c^=s.charCodeAt(i);return c.toString(16).toUpperCase().padStart(2,'0');}
var nSt={RMC:true,GGA:false,GSA:false,GSV:false,VTG:false,ZDA:false};
function tN(b,n){nSt[n]=!nSt[n];b.classList.toggle('active',nSt[n]);nm('msg',n,nSt[n]?1:0);}
function nm(a,p,v){var r='';
  switch(a){case'baud':{var b=document.getElementById('c-bd').value;r='$CCCAS,1,'+b+'*'+nCS('CCCAS,1,'+b);toa('已发(需重启)','warning');break;}
  case'int':{var i=document.getElementById('c-in').value;r='$CCINV,'+i+',*'+nCS('CCINV,'+i+',');toa('已设','info');break;}
  case'mod':{var m=document.getElementById('c-mo').value;r='$CCSIR,'+m+',0*'+nCS('CCSIR,'+m+',0');toa('已切换','info');break;}
  case'dft':r='$CCDFT,0,*66';toa('已恢复(需重启)','warning');break;
  case'cold':r='$CCSIR,2,1*4B';toa('冷启动~28s','warning');break;
  case'msg':r='$CCMSG,'+p+',1,'+v+'*'+nCS('CCMSG,'+p+',1,'+v);toa(p+' '+(v?'开':'关'),'info');break;}
  document.getElementById('c-raw').value=r;fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw:r})}).catch(function(){});}
function nmR(){var r=document.getElementById('c-raw').value.trim();if(!r){toa('输入指令','warning');return;}
  fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw:r})}).then(function(r){return r.json();}).then(function(d){toa('已发','success');}).catch(function(){toa('(需硬件)','warning');});}
